[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-hijack-chat-to-cron-daemon"
version = "0.1.0"
description = "Autonomous omni-intent extractor, self-healing execution engine, and chat-to-cron daemon for Hermes."
readme = "README.md"
authors = [{ name = "Sunzzx" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
synapse-hijack = "synapse_hijack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
